name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: "Tests & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            gobject-introspection \
            libcairo2-dev \
            pkg-config

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Unit Tests
        run: uv run pytest

  flatpak:
    name: "Flatpak Build"
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.github.urkh.ytgmusic.flatpak
          manifest-path: com.github.urkh.ytgmusic.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.urkh.ytgmusic.flatpak
          path: com.github.urkh.ytgmusic.flatpak

      - name: Release to GitHub (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: com.github.urkh.ytgmusic.flatpak
