name: Flatpak CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (for any scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flatpak and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//44 org.gnome.Sdk//44

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo build-dir org.ytg_music.yml

      - name: Run tests inside Flatpak (optional)
        run: |
          flatpak run --command=sh org.ytg_music -c "pytest"
        continue-on-error: true

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle repo org.ytg_music.flatpak org.ytg_music

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: org.ytg_music.flatpak

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          hub release create -m "Release $tag" -a org.ytg_music.flatpak "$tag"

      - name: Upload bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: org.ytg_music.flatpak
