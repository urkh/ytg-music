[project]
name = "ytg-music"
version = "0.0.3"
description = "Native GTK4/Libadwaita desktop client for YouTube Music"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browsercookie>=0.8.2",
    "pydantic>=2.13.4",
    "pygobject>=3.56.3",
    "pytubefix>=10.10.1",
    "ytmusicapi>=1.12.1",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "memray>=1.19.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "."
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["models", "services", "utils", "views", "ui"]

[tool.ruff.format]
quote-style = "single"
